# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# 启动安全自检：生产部署必须设 APP_SECURITY_STRICT=true，否则只打印告警不阻断
app:
  security:
    strict: ${APP_SECURITY_STRICT:false}

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（后台令牌签名）：必须通过环境变量 TOKEN_SECRET 注入（≥32 位随机串），
  # 仓库内不提供默认值，未设置时启动即失败（fail-fast，避免带着弱密钥上线）
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  # 关闭「通用响应覆盖」：本项目有 @RestControllerAdvice 全局异常处理，
  # 开启时会把每个接口的 200 响应体清空（schema 丢失），导致导出的规格没有响应字段。
  override-with-generic-response: false
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '全部接口'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 小程序配置
mini:
  token:
    # 小程序登录态有效期（天）
    expire-days: 7
    # 小程序令牌独立签名密钥，留空则回退 token.secret（生产必须通过环境变量 MINI_TOKEN_SECRET 分设）
    secret: ${MINI_TOKEN_SECRET:}
  wx:
    # 微信小程序凭证，任务14使用；留空则走可联调模拟登录（仅限本地/联调环境）
    app-id: ${MINI_WX_APP_ID:}
    app-secret: ${MINI_WX_APP_SECRET:}
    # 未配置凭证时是否允许模拟登录：生产必须为 false，否则任意 code 均可换取登录态
    mock-enabled: ${MINI_WX_MOCK_ENABLED:true}
  rpa:
    # 阶段五开关：false 时依赖 RPA 的接口明确返回 501，不做静默成功
    enabled: ${MINI_RPA_ENABLED:false}
  # 敏感字段 AES 加密密钥（税务账号密码），必须通过环境变量 MINI_CRYPTO_KEY 注入（≥32 位随机串）
  crypto:
    key: ${MINI_CRYPTO_KEY:}
    # 历史密钥（逗号分隔），仅用于解密旧密文，密钥轮换时把旧密钥放这里
    key-old: ${MINI_CRYPTO_KEY_OLD:}
  reg:
    # 注册收件是否强制必传材料（营业执照/经办人证件等由前端按主体类型提交，见 5.5 材料类型码字典）
    require-materials: false

